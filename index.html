<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayMEMO - Учет платежей</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS для Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.css"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Иконки -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#64748b',
                        success: '#10b981',
                        danger: '#ef4444',
                        warning: '#f59e0b',
                        darkBg: '#0f172a',
                        darkCard: '#1e293b'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .sidebar-transition { transition: transform 0.3s ease-in-out; }
        /* Скроллбар */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        .modal-overlay { background-color: rgba(0,0,0,0.5); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-darkBg dark:text-gray-100 h-screen overflow-hidden flex flex-col">

    <!-- Авторизация -->
    <div id="authScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-200 dark:bg-darkBg">
        <div class="bg-white dark:bg-darkCard p-8 rounded-xl shadow-2xl w-full max-w-md">
            <h2 class="text-3xl font-bold text-center mb-6 text-primary">PayMEMO</h2>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Логин</label>
                    <input type="text" id="username" class="w-full p-3 rounded-lg border dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-primary outline-none" placeholder="admin">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Пароль</label>
                    <input type="password" id="password" class="w-full p-3 rounded-lg border dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-primary outline-none" placeholder="••••">
                </div>
                <button type="submit" class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3 rounded-lg transition">Войти</button>
                <p id="loginError" class="text-danger text-center text-sm hidden">Неверный логин или пароль</p>
            </form>
        </div>
    </div>

    <!-- Основное приложение -->
    <div id="appScreen" class="hidden flex-1 flex overflow-hidden">
        
        <!-- Мобильная шапка -->
        <div class="md:hidden fixed top-0 left-0 right-0 h-16 bg-white dark:bg-darkCard shadow z-20 flex items-center justify-between px-4">
            <button id="mobileMenuBtn" class="text-gray-600 dark:text-gray-300 focus:outline-none">
                <i class="fas fa-bars text-2xl"></i>
            </button>
            <span class="font-bold text-lg text-primary">PayMEMO</span>
            <div class="w-8"></div> <!-- Spacer -->
        </div>

        <!-- Боковое меню -->
        <aside id="sidebar" class="bg-white dark:bg-darkCard w-64 flex-shrink-0 border-r dark:border-gray-700 sidebar-transition absolute md:relative h-full z-10 transform -translate-x-full md:translate-x-0 pt-16 md:pt-0 flex flex-col">
            <div class="p-6 hidden md:block">
                <h1 class="text-2xl font-bold text-primary">PayMEMO</h1>
                <p class="text-xs text-gray-500 mt-1" id="currentUserDisplay">User</p>
            </div>
            
            <nav class="flex-1 overflow-y-auto py-4">
                <ul class="space-y-1 px-3">
                    <li><button onclick="router('dashboard')" class="nav-item w-full text-left px-4 py-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-3"><i class="fas fa-home w-5"></i> Дашборд</button></li>
                    <li><button onclick="router('payments')" class="nav-item w-full text-left px-4 py-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-3"><i class="fas fa-list w-5"></i> Платежи</button></li>
                    <li><button onclick="router('archive')" class="nav-item w-full text-left px-4 py-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-3"><i class="fas fa-archive w-5"></i> Архив</button></li>
                    <li><button onclick="router('analytics')" class="nav-item w-full text-left px-4 py-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-3"><i class="fas fa-chart-pie w-5"></i> Аналитика</button></li>
                    <li id="adminLogsLink" class="hidden"><button onclick="router('logs')" class="nav-item w-full text-left px-4 py-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-3"><i class="fas fa-history w-5"></i> Логи событий</button></li>
                    <li id="adminUsersLink" class="hidden"><button onclick="router('users')" class="nav-item w-full text-left px-4 py-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-3"><i class="fas fa-users w-5"></i> Пользователи</button></li>
                </ul>
            </nav>

            <div class="p-4 border-t dark:border-gray-700">
                <button onclick="router('settings')" class="w-full text-left px-4 py-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-3 mb-2"><i class="fas fa-cog w-5"></i> Настройки</button>
                <button onclick="logout()" class="w-full text-left px-4 py-3 rounded-lg text-danger hover:bg-red-50 dark:hover:bg-red-900/20 flex items-center gap-3"><i class="fas fa-sign-out-alt w-5"></i> Выйти</button>
            </div>
        </aside>

        <!-- Основной контент -->
        <main class="flex-1 overflow-y-auto p-4 md:p-8 pt-20 md:pt-8 relative">
            <!-- Контейнер для уведомлений -->
            <div id="toastContainer" class="fixed top-4 right-4 z-50 space-y-2"></div>

            <!-- Страницы -->
            <div id="pageContent"></div>
        </main>
    </div>

    <!-- Модальные окна -->
    <!-- Универсальное подтверждение -->
    <div id="confirmModal" class="fixed inset-0 z-50 hidden items-center justify-center modal-overlay">
        <div class="bg-white dark:bg-darkCard rounded-xl p-6 max-w-sm w-full mx-4 shadow-2xl transform transition-all scale-100">
            <h3 class="text-lg font-bold mb-2" id="confirmTitle">Подтверждение</h3>
            <p class="text-gray-600 dark:text-gray-300 mb-6" id="confirmMessage">Вы уверены?</p>
            <div class="flex justify-end gap-3">
                <button onclick="closeModal('confirmModal')" class="px-4 py-2 rounded-lg border dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700">Отмена</button>
                <button id="confirmActionBtn" class="px-4 py-2 rounded-lg bg-danger text-white hover:bg-red-600">Да, удалить</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно Платежа -->
    <div id="paymentModal" class="fixed inset-0 z-50 hidden items-center justify-center modal-overlay">
        <div class="bg-white dark:bg-darkCard rounded-xl p-6 max-w-lg w-full mx-4 shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 class="text-xl font-bold mb-4" id="paymentModalTitle">Новый платеж</h3>
            <form id="paymentForm" class="space-y-4">
                <input type="hidden" id="payId">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm mb-1">Банк</label>
                        <input type="text" id="payBank" required class="w-full p-2 rounded border dark:bg-gray-700 dark:border-gray-600">
                    </div>
                    <div>
                        <label class="block text-sm mb-1">Тип платежа</label>
                        <select id="payType" class="w-full p-2 rounded border dark:bg-gray-700 dark:border-gray-600">
                            <!-- Заполняется динамически -->
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm mb-1">Сумма</label>
                    <input type="number" step="0.01" id="payAmount" required class="w-full p-2 rounded border dark:bg-gray-700 dark:border-gray-600">
                </div>
                <div>
                    <label class="block text-sm mb-1">Дата платежа</label>
                    <input type="date" id="payDate" required class="w-full p-2 rounded border dark:bg-gray-700 dark:border-gray-600">
                </div>
                <div>
                    <label class="block text-sm mb-1">Комментарий</label>
                    <textarea id="payComment" rows="2" class="w-full p-2 rounded border dark:bg-gray-700 dark:border-gray-600"></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" onclick="closeModal('paymentModal')" class="px-4 py-2 rounded border dark:border-gray-600">Отмена</button>
                    <button type="submit" class="px-4 py-2 rounded bg-primary text-white">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- КОНФИГУРАЦИЯ И СОСТОЯНИЕ ---
        const DB_KEY = 'paymemo_db_v2';
        let currentUser = null;
        let db = {
            users: [{ id: 1, username: 'admin', password: 'admin', role: 'admin' }],
            payments: [],
            logs: [],
            settings: {
                theme: 'light',
                notifyDaysBefore: 3,
                notifyTime: '09:00',
                paymentTypes: ['Ипотека', 'Автокредит', 'Кредитная карта', 'Потребительский кредит', 'Коммуналка', 'Интернет/Телефон']
            }
        };

        // --- ИНИЦИАЛИЗАЦИЯ ---
        function init() {
            loadData();
            checkAuth();
            setupEventListeners();
            
            // Проверка на битые данные (если вдруг массив users не массив)
            if (!Array.isArray(db.users)) {
                console.warn("DB corrupted, resetting users");
                db.users = [{ id: 1, username: 'admin', password: 'admin', role: 'admin' }];
                saveData();
            }
            // Гарантируем наличие поля roles у админа если его нет
            if (db.users.length > 0 && !db.users[0].role) {
                db.users[0].role = 'admin';
                saveData();
            }
        }

        function loadData() {
            const stored = localStorage.getItem(DB_KEY);
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    // Мерджим с дефолтными значениями на случай обновлений структуры
                    db = { ...db, ...parsed };
                    if(!db.settings) db.settings = { theme: 'light', paymentTypes: [] };
                    if(!db.settings.paymentTypes || db.settings.paymentTypes.length === 0) {
                         db.settings.paymentTypes = ['Ипотека', 'Автокредит', 'Кредитная карта', 'Потребительский кредит', 'Коммуналка'];
                    }
                } catch (e) {
                    console.error("Ошибка чтения БД", e);
                    localStorage.removeItem(DB_KEY);
                }
            }
            applyTheme(db.settings.theme);
        }

        function saveData() {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        function logEvent(action, details) {
            const entry = {
                id: Date.now(),
                date: new Date().toISOString(),
                user: currentUser ? currentUser.username : 'System',
                action,
                details
            };
            db.logs.unshift(entry); // Добавляем в начало
            if (db.logs.length > 1000) db.logs.pop(); // Храним последние 1000
            saveData();
        }

        // --- АВТОРИЗАЦИЯ ---
        function checkAuth() {
            const sessionUser = sessionStorage.getItem('paymemo_user');
            if (sessionUser) {
                currentUser = JSON.parse(sessionUser);
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('appScreen').classList.remove('hidden');
                document.getElementById('currentUserDisplay').textContent = currentUser.username;
                
                if (currentUser.role === 'admin') {
                    document.getElementById('adminLogsLink').classList.remove('hidden');
                    document.getElementById('adminUsersLink').classList.remove('hidden');
                }
                router('dashboard');
                startNotificationCheck();
            } else {
                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('appScreen').classList.add('hidden');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const user = db.users.find(user => user.username === u && user.password === p);
            
            if (user) {
                currentUser = user;
                sessionStorage.setItem('paymemo_user', JSON.stringify(user));
                logEvent('Вход в систему', `Пользователь ${user.username} вошел`);
                checkAuth();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
                logEvent('Ошибка входа', `Попытка входа с логином ${u}`);
            }
        });

        function logout() {
            logEvent('Выход из системы', `Пользователь ${currentUser.username} вышел`);
            currentUser = null;
            sessionStorage.removeItem('paymemo_user');
            location.reload();
        }

        // --- РОУТИНГ ---
        function router(page) {
            const content = document.getElementById('pageContent');
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => item.classList.remove('bg-blue-50', 'text-primary', 'dark:bg-gray-800'));
            
            // Подсветка активного пункта (упрощенно)
            // ...

            // Закрываем мобильное меню при переходе
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            }

            switch(page) {
                case 'dashboard': renderDashboard(content); break;
                case 'payments': renderPayments(content); break;
                case 'archive': renderArchive(content); break;
                case 'analytics': renderAnalytics(content); break;
                case 'settings': renderSettings(content); break;
                case 'users': if(currentUser.role === 'admin') renderUsers(content); break;
                case 'logs': if(currentUser.role === 'admin') renderLogs(content); break;
            }
        }

        // --- РЕНДЕРИНГ СТРАНИЦ ---

        function renderDashboard(container) {
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();

            const activePayments = db.payments.filter(p => !p.archived);
            const archivedPayments = db.payments.filter(p => p.archived);
            
            const upcoming = activePayments.filter(p => {
                const d = new Date(p.date);
                return d >= now && d.getTime() - now.getTime() < 14 * 24 * 60 * 60 * 1000;
            }).sort((a,b) => new Date(a.date) - new Date(b.date));

            const overdue = activePayments.filter(p => new Date(p.date) < now);
            
            const monthSum = archivedPayments
                .filter(p => {
                    const d = new Date(p.date); // Дата оплаты (когда архивирован или дата платежа?)
                    // Будем считать по дате платежа для статистики
                    return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
                })
                .reduce((sum, p) => sum + parseFloat(p.amount), 0);

            container.innerHTML = `
                <h2 class="text-2xl font-bold mb-6">Дашборд</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                    <div class="bg-white dark:bg-darkCard p-4 rounded-xl shadow border-l-4 border-blue-500">
                        <div class="text-gray-500 text-sm">Всего активных</div>
                        <div class="text-2xl font-bold">${activePayments.length}</div>
                    </div>
                    <div class="bg-white dark:bg-darkCard p-4 rounded-xl shadow border-l-4 border-green-500">
                        <div class="text-gray-500 text-sm">Оплачено в этом месяце</div>
                        <div class="text-2xl font-bold">${monthSum.toLocaleString()} ₽</div>
                    </div>
                    <div class="bg-white dark:bg-darkCard p-4 rounded-xl shadow border-l-4 border-red-500">
                        <div class="text-gray-500 text-sm">Просрочено</div>
                        <div class="text-2xl font-bold text-red-500">${overdue.length}</div>
                    </div>
                    <div class="bg-white dark:bg-darkCard p-4 rounded-xl shadow border-l-4 border-yellow-500">
                        <div class="text-gray-500 text-sm">Ближайшие (14 дней)</div>
                        <div class="text-2xl font-bold">${upcoming.length}</div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-white dark:bg-darkCard p-6 rounded-xl shadow">
                        <h3 class="font-bold mb-4 text-lg">🔥 Срочно к оплате</h3>
                        ${overdue.length > 0 || upcoming.length > 0 ? `
                            <div class="space-y-3">
                                ${[...overdue, ...upcoming].slice(0, 5).map(p => `
                                    <div class="flex justify-between items-center p-3 bg-gray-50 dark:bg-gray-700/50 rounded-lg ${new Date(p.date) < now ? 'border-l-4 border-red-500' : ''}">
                                        <div>
                                            <div class="font-bold">${p.bank}</div>
                                            <div class="text-xs text-gray-500">${p.type} • ${new Date(p.date).toLocaleDateString()}</div>
                                        </div>
                                        <div class="font-bold text-right">
                                            <div>${parseFloat(p.amount).toLocaleString()} ₽</div>
                                            ${new Date(p.date) < now ? '<span class="text-xs text-red-500">Просрочено</span>' : ''}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        ` : '<div class="text-gray-500">Все платежи в порядке!</div>'}
                    </div>
                    
                    <div class="bg-white dark:bg-darkCard p-6 rounded-xl shadow flex flex-col">
                         <h3 class="font-bold mb-4 text-lg">Быстрые действия</h3>
                         <div class="grid grid-cols-2 gap-4">
                             <button onclick="openPaymentModal()" class="p-4 bg-primary text-white rounded-xl hover:bg-blue-600 transition flex flex-col items-center justify-center gap-2">
                                 <i class="fas fa-plus text-2xl"></i> Новый платеж
                             </button>
                             <button onclick="document.getElementById('excelInput').click()" class="p-4 bg-green-600 text-white rounded-xl hover:bg-green-700 transition flex flex-col items-center justify-center gap-2">
                                 <i class="fas fa-file-excel text-2xl"></i> Импорт Excel
                             </button>
                             <input type="file" id="excelInput" class="hidden" accept=".xlsx, .xls" onchange="handleExcelImport(this)">
                         </div>
                         <div class="mt-6 p-4 bg-blue-50 dark:bg-blue-900/20 rounded-lg text-sm text-blue-800 dark:text-blue-200">
                             <i class="fas fa-info-circle mr-2"></i> Совет: Используйте импорт Excel для массового добавления. Формат: Банк, Тип, Сумма, Дата, Комментарий.
                         </div>
                    </div>
                </div>
            `;
        }

        function renderPayments(container) {
            const list = db.payments.filter(p => !p.archived).sort((a,b) => new Date(a.date) - new Date(b.date));
            
            let html = `
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">Активные платежи</h2>
                    <div class="flex gap-2">
                        <button onclick="openPaymentModal()" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-blue-600"><i class="fas fa-plus mr-2"></i>Создать</button>
                        <button onclick="document.getElementById('excelInputMain').click()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700"><i class="fas fa-file-import mr-2"></i>Импорт</button>
                        <input type="file" id="excelInputMain" class="hidden" accept=".xlsx, .xls" onchange="handleExcelImport(this)">
                    </div>
                </div>
                <div class="bg-white dark:bg-darkCard rounded-xl shadow overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 uppercase text-xs">
                                <tr>
                                    <th class="p-4">Дата</th>
                                    <th class="p-4">Банк</th>
                                    <th class="p-4">Тип</th>
                                    <th class="p-4">Сумма</th>
                                    <th class="p-4">Комментарий</th>
                                    <th class="p-4 text-right">Действия</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y dark:divide-gray-700">
            `;

            if (list.length === 0) {
                html += `<tr><td colspan="6" class="p-8 text-center text-gray-500">Список пуст</td></tr>`;
            } else {
                list.forEach(p => {
                    const isOverdue = new Date(p.date) < new Date();
                    html += `
                        <tr class="hover:bg-gray-50 dark:hover:bg-gray-800 ${isOverdue ? 'bg-red-50 dark:bg-red-900/10' : ''}">
                            <td class="p-4 font-mono text-sm">${new Date(p.date).toLocaleDateString()}</td>
                            <td class="p-4 font-bold">${p.bank}</td>
                            <td class="p-4"><span class="px-2 py-1 bg-gray-200 dark:bg-gray-600 rounded text-xs">${p.type}</span></td>
                            <td class="p-4 font-bold">${parseFloat(p.amount).toLocaleString()} ₽</td>
                            <td class="p-4 text-sm text-gray-500 truncate max-w-xs">${p.comment || '-'}</td>
                            <td class="p-4 text-right space-x-2">
                                <button onclick="confirmAction('Оплатить платеж?', 'Переместить в архив?', () => markAsPaid(${p.id}))" class="text-green-600 hover:text-green-800" title="Оплатить"><i class="fas fa-check-circle"></i></button>
                                <button onclick="openPaymentModal(${p.id})" class="text-blue-600 hover:text-blue-800" title="Редактировать"><i class="fas fa-edit"></i></button>
                                <button onclick="confirmAction('Удалить платеж?', 'Это действие нельзя отменить.', () => deletePayment(${p.id}))" class="text-red-600 hover:text-red-800" title="Удалить"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
            }

            html += `</tbody></table></div></div>`;
            container.innerHTML = html;
        }

        function renderArchive(container) {
            const list = db.payments.filter(p => p.archived).sort((a,b) => new Date(b.date) - new Date(a.date));
            
            let html = `
                <h2 class="text-2xl font-bold mb-6">Архив платежей</h2>
                <div class="bg-white dark:bg-darkCard rounded-xl shadow overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 uppercase text-xs">
                                <tr>

        function openPaymentModal(id = null) {

            // Заполняем типы

                document.getElementById('payId').value = p.id;
                document.getElementById('payBank').value = p.bank;
                document.getElementById('payType').value = p.type;
                document.getElementById('payAmount').value = p.amount;
                document.getElementById('payDate').value = p.date;
                document.getElementById('payComment').value = p.comment || '';
            } else {
                title.textContent = 'Новый платеж';
                form.reset();

            }
            modal.classList.remove('hidden');
            modal.classList.add('flex');

        document.getElementById('paymentForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('payId').value;
            const bank = document.getElementById('payBank').value;
            const type = document.getElementById('payType').value;
            const amount = parseFloat(document.getElementById('payAmount').value);
            const date = document.getElementById('payDate').value;
            const comment = document.getElementById('payComment').value;

            if (id) {
                // Edit
                const idx = db.payments.findIndex(p => p.id == id);
                if (idx !== -1) {
                    const oldVal = JSON.stringify(db.payments[idx]);
                    db.payments[idx] = { ...db.payments[idx], bank, type, amount, date, comment };
                    logEvent('Редактирование платежа', `ID: ${id}. Было: ${oldVal}, Стало: Банк=${bank}, Сумма=${amount}`);
                }
            } else {
                // Create
                const newId = Date.now();
                db.payments.push({ id: newId, bank, type, amount, date, comment, archived: false, createdBy: currentUser.username });
                logEvent('Создание платежа', `ID: ${newId}, Банк: ${bank}, Сумма: ${amount}`);
            }
            saveData();
            closeModal('paymentModal');
            router('payments');
        });

            const p = db.payments.find(x => x.id === id);

            const p = db.payments.find(x => x.id === id);
            if (p) {
                p.archived = false;
                logEvent('Возврат платежа из архива', `ID: ${id}`);
                saveData();
                router('archive');
                showToast('Платеж восстановлен', 'success');
            }

        function deletePayment(id) {
            const idx = db.payments.findIndex(p => p.id === id);
            if (idx !== -1) {
                const p = db.payments[idx];
                db.payments.splice(idx, 1);
                logEvent('Удаление платежа', `ID: ${id}, Банк: ${p.bank}`);
                saveData();
                // Перерисовать текущую страницу
                const page = document.getElementById('pageContent');
                if (page.innerHTML.includes('Архив')) renderArchive(page);
                else renderPayments(page);
                showToast('Платеж удален', 'danger');
            }
        }

        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        }

        function showBrowserNotification(title, body) {
            requestNotificationPermission();
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, {
                    body: body,
                    icon: 'https://cdn-icons-png.flaticon.com/512/2921/2921226.png' // Иконка денег
                });
            } else {
                showToast(`${title}: ${body}`, 'info');
            }
        }

        function startNotificationCheck() {
            // Проверяем раз в минуту
            setInterval(() => {
                const now = new Date();
                const currentTime = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                
                if (currentTime === db.settings.notifyTime) {
                    const daysThreshold = db.settings.notifyDaysBefore;
                    const limitDate = new Date();
                    limitDate.setDate(limitDate.getDate() + daysThreshold);
                    
                    const upcoming = db.payments.filter(p => {
                        if (p.archived) return false;
                        const d = new Date(p.date);
                        // Условие: дата платежа <= (сегодня + N дней) И дата платежа >= сегодня
                        // Или точно сегодня
                        return d >= new Date().setHours(0,0,0,0) && d <= limitDate.setHours(23,59,59,999);
                    });

                    if (upcoming.length > 0) {
                        showBrowserNotification(`Напоминание о платежах (${upcoming.length})`, `Сумма к оплате: ${upcoming.reduce((s,p)=>s+parseFloat(p.amount),0).toLocaleString()} ₽`);
                    }
                }
            }, 60000);
        }

        function downloadTemplate() {
            const ws = XLSX.utils.json_to_sheet([
                { "Банк": "Сбербанк", "Тип": "Ипотека", "Сумма": 50000, "Дата": "2023-10-25", "Комментарий": "Ежемесячный" },
                { "Банк": "Тинькофф", "Тип": "Кредитная карта", "Сумма": 15000, "Дата": "2023-10-28", "Комментарий": "" }
            ]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Шаблон");
            XLSX.writeFile(wb, "Shablon_Platezhey.xlsx");
        }

        function handleExcelImport(input) {
            const file = input.files[0];
            if (!file) return;
            
            confirmAction('Импортировать данные?', 'Все строки из файла будут добавлены в список платежей.', () => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet);
                    
                    let count = 0;
                    json.forEach(row => {
                        if (row['Банк'] && row['Сумма'] && row['Дата']) {
                            // Конвертация даты Excel если нужно, но sheet_to_json обычно справляется
                            let dateStr = row['Дата'];
                            if (typeof dateStr === 'number') {
                                // Простая конвертация serial date
                                const dateObj = new Date(Math.round((dateStr - 25569)*86400*1000));
                                dateStr = dateObj.toISOString().split('T')[0];
                            }
                            
                            db.payments.push({
                                id: Date.now() + Math.random(),
                                bank: row['Банк'],
                                type: row['Тип'] || 'Прочее',
                                amount: parseFloat(row['Сумма']),
                                date: dateStr,
                                comment: row['Комментарий'] || '',
                                archived: false,
                                createdBy: currentUser.username
                            });
                            count++;
                        }
                    });
                    
                    logEvent('Импорт из Excel', `Загружено ${count} платежей`);
                    saveData();
                    router('payments');
                    showToast(`Успешно загружено ${count} платежей`, 'success');
                };
                reader.readAsArrayBuffer(file);
            });
            input.value = ''; // Сброс
        }

        function closeModal(id) {

        function confirmAction(title, message, callback) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMessage').textContent = message;
            const btn = document.getElementById('confirmActionBtn');
            
            // Клонируем кнопку чтобы убрать старые слушатели
            const newBtn = btn.cloneNode(true);
            btn.parentNode.replaceChild(newBtn, btn);
            
            newBtn.addEventListener('click', () => {
                callback();
                closeModal('confirmModal');
            });
            
            const modal = document.getElementById('confirmModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const div = document.createElement('div');
            const colors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                danger: 'bg-red-500',
                info: 'bg-blue-500'
            };
            div.className = `${colors[type] || colors.info} text-white px-6 py-3 rounded-lg shadow-lg transform transition-all duration-300 translate-x-full`;
            div.textContent = msg;
            container.appendChild(div);
            
            setTimeout(() => div.classList.remove('translate-x-full'), 100);
            setTimeout(() => {
                div.classList.add('opacity-0');
                setTimeout(() => div.remove(), 300);
            }, 3000);
        }

            const sidebar = document.getElementById('sidebar');
            
            menuBtn.addEventListener('click', () => {
                sidebar.classList.toggle('-translate-x-full');
            });
            
            // Закрытие меню при клике вне его (на мобильных)
            document.addEventListener('click', (e) => {
                if (window.innerWidth < 768 && 
                    !sidebar.contains(e.target) && 
                    !menuBtn.contains(e.target) &&
                    !sidebar.classList.contains('-translate-x-full')) {
                    sidebar.classList.add('-translate-x-full');
                }
            });

            // Тема
            if (db.settings.theme === 'dark') {
                document.documentElement.classList.add('dark');
            }
        }

        function applyTheme(theme) {
            if (theme === 'dark') document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        }

        // Запуск
        init();

    </script>
</body>
</html>
